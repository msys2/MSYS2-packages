# makepkg configuration for cross-building packages for aarch64-pc-cygwin on
# an x86_64 MSYS2 host.
#
# Usage:  makepkg --config .ci/makepkg-aarch64-cross.conf ...
#
# Recipes that support this have an aarch64 branch guarded on
# CARCH == aarch64 (or MSYS2_ARM64_CROSS); their native build is unchanged.

# shellcheck source=/dev/null
source /etc/makepkg.conf

# --- target/host -----------------------------------------------------------
# CARCH=aarch64 selects the recipes' aarch64 branch.  CHOST is the machine the
# build runs on, as in /etc/makepkg.conf; the recipes pass
# --host=aarch64-pc-cygwin themselves.
CARCH="aarch64"
CHOST="x86_64-pc-cygwin"

# Also lets the aarch64 branch be selected with just an environment variable.
export MSYS2_ARM64_CROSS=1

# --- toolchain -------------------------------------------------------------
CC="aarch64-pc-cygwin-gcc"
CXX="aarch64-pc-cygwin-g++"

# The other binutils have to be the cross ones too.  libtool decides whether
# a library is shared by running "$OBJDUMP -f" on it; the host objdump does not
# recognise aarch64 objects, and libtool then quietly builds static libraries
# only.  configure finds the cross tools on its own, but the generated libtool
# script still records plain "objdump" unless these are exported.
export OBJDUMP="aarch64-pc-cygwin-objdump"
export NM="aarch64-pc-cygwin-nm"
export AR="aarch64-pc-cygwin-ar"
export RANLIB="aarch64-pc-cygwin-ranlib"
export STRIP="aarch64-pc-cygwin-strip"
export DLLTOOL="aarch64-pc-cygwin-dlltool"
export AS="aarch64-pc-cygwin-as"
export OBJCOPY="aarch64-pc-cygwin-objcopy"
export WINDRES="aarch64-pc-cygwin-windres"
# LD is not set: linking goes through $CC, which picks the matching ld.  Some
# configure tests call $LD directly with gcc-style flags and fail if it is set.

# --- flags -----------------------------------------------------------------
# Drop the host's x86-specific CFLAGS (-march=nocona etc.), invalid for
# aarch64, and keep -pipe.  LDFLAGS stays the host's (empty):
# --disable-high-entropy-va is in the cross gcc's specs file.
unset CPPFLAGS
CFLAGS="-pipe"
CXXFLAGS="-pipe"

# --- packaging -------------------------------------------------------------
# !strip: stripping with the cross strip is not worth the risk here.
# !debug, !lto: keep the cross build simple.
# purge, as natively: drops usr/share/info/dir, which every package with info
# pages would otherwise ship, so they could not be installed side by side.
OPTIONS=(!strip !debug staticlibs docs !libtool emptydirs !zipman purge !autodeps)

INTEGRITY_CHECK=(sha256)

PKGEXT='.pkg.tar.zst'
