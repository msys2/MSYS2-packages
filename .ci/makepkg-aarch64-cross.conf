# makepkg-aarch64-cross.conf — cross-build config for the aarch64-pc-cygwin userland seed.
#
# Usage:  makepkg --config .ci/makepkg-aarch64-cross.conf ...
#
# Sources the system /etc/makepkg.conf and overrides the arch/toolchain knobs so
# makepkg builds aarch64-pc-cygwin packages while running on an x86_64 host. This
# mirrors the in-tree pacman/makepkg-mingw `makepkg --config` idiom.
#
# The cross-aware seed PKGBUILDs key their cross branch off `CARCH == aarch64`
# (or MSYS2_ARM64_CROSS below); their native i686/x86_64 path is left
# byte-identical and is never reached when this config is in effect.

# shellcheck source=/dev/null
source /etc/makepkg.conf

# --- target/host identity -------------------------------------------------
# CARCH=aarch64 makes `arch=('aarch64')` a legal build target and is what the
# recipe guard tests. CHOST stays the BUILD machine triple (where configure and
# the gcc driver actually execute); each recipe passes --host=aarch64-pc-cygwin
# itself for the cross target.
CARCH="aarch64"
CHOST="x86_64-pc-msys"

# Secondary signal for the recipe guard, so the cross branch can also be
# triggered with a bare env var when hacking locally without this config.
export MSYS2_ARM64_CROSS=1

# --- toolchain ------------------------------------------------------------
CC="aarch64-pc-cygwin-gcc"
CXX="aarch64-pc-cygwin-g++"

# The rest of the binutils must be the CROSS ones too. libtool's file-magic test
# runs `$OBJDUMP -f` on a candidate library and greps for a known PE format; the
# host x86_64 objdump answers "file format not recognized" for every ARM64
# archive member, so the test fails and libtool silently falls back to a STATIC
# library.
#
# These exports are required, not belt-and-suspenders: AC_CHECK_TOOL does find
# aarch64-pc-cygwin-objdump for its own probes, but the generated `libtool` still
# records OBJDUMP="objdump" unless they are exported.
export OBJDUMP="aarch64-pc-cygwin-objdump"
export NM="aarch64-pc-cygwin-nm"
export AR="aarch64-pc-cygwin-ar"
export RANLIB="aarch64-pc-cygwin-ranlib"
export STRIP="aarch64-pc-cygwin-strip"
export DLLTOOL="aarch64-pc-cygwin-dlltool"
export AS="aarch64-pc-cygwin-as"
export OBJCOPY="aarch64-pc-cygwin-objcopy"
export WINDRES="aarch64-pc-cygwin-windres"
# LD is deliberately NOT set: autotools/libtool drive linking through the gcc
# driver ($CC), which selects its own matching ld. Overriding LD here makes some
# configure probes invoke the bare linker with gcc-style flags.

# --- flags ----------------------------------------------------------------
# Drop the host's x86-specific CFLAGS (e.g. -march=nocona), invalid for aarch64.
#
# Default to gnu17/gnu++17: GCC-15 defaults to C23/C++23, where old-style
# prototypes and implicit ints are hard errors, and many of these packages'
# autoconf probes still use that legacy style (gmp's long-long test calls
# `void *g()` with args, so C23 rejects the whole compiler as non-working).
#
# Recipes needing another standard (readline/bash want gnu89) pass their own
# CFLAGS on the configure line, which wins as the last -std on the line.
unset CPPFLAGS
CFLAGS="-std=gnu17"
CXXFLAGS="-std=gnu++17"

# --disable-high-entropy-va: required on every WoA link, since high-entropy ASLR
#   breaks the MSYS fork/exec address-space assumptions on ARM64.
#
# -u _pei386_runtime_relocator: any ARM64 shared library reading a *data* symbol
#   from another DLL needs a runtime pseudo-reloc stub, which ld synthesises only
#   AFTER it finishes scanning archives -- so the stub's fresh reference has no
#   archive pass left to satisfy it and pseudo-reloc-dummy.o is never pulled from
#   libcygwin.a. Forcing the undefined reference to exist BEFORE the scan pulls
#   the member in, matching what native x86_64 reaches on its own (it routes
#   cross-DLL data through a .refptr and never needs this path).
#
#   Do NOT substitute --disable-runtime-pseudo-reloc: on aarch64 that path is
#   currently the only mechanism for cross-DLL data imports (pseudo-reloc.cc
#   patches ADRP/ADD at load time under #ifdef __aarch64__), so disabling it
#   turns link-time errors into runtime faults.
#
#   The cross driver's LINK_SPEC now carries this -u for shared links, so it is
#   redundant with a current toolchain; kept so the seed also builds with an
#   older cross gcc.
LDFLAGS="-Wl,--disable-high-entropy-va -Wl,-u,_pei386_runtime_relocator"

# --- Win32 import libs ----------------------------------------------------
# The Win32 import libs (libkernel32/user32/advapi32/shell32/ntdll.a) ship in a
# w32api SUBDIRECTORY of the sysroot that the cross `ld` does not search, so
# -lkernel32 & co. are unresolvable by default. They are staged into the sysroot
# libdir at toolchain-install time rather than via a flag here.

# --- packaging ------------------------------------------------------------
# !strip: the cross strip differs from host strip and stripping cross output on
#   an emulated host is error-prone; the seed is not shipped size-critical.
#   !debug/!lto keep the cross build simple and reproducible.
OPTIONS=(!strip !debug staticlibs docs !libtool emptydirs !zipman !purge !autodeps)

# Skip dependency autodetection: the seed is chained by hand (each built package
# is unpacked into the sysroot before the next builds), not via a pacman DB.
INTEGRITY_CHECK=(sha256)

PKGEXT='.pkg.tar.zst'
